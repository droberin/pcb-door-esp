esphome:
  name: door
  friendly_name: door

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "YOUR ENCRYPTION KEY"
  services:
    - service: set_relay_duration
      variables:
        duration: float
      then:
        - lambda: |-
            id(relay_duration).publish_state(duration);

ota:
  - platform: esphome
    password: "yourotapassword"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80  # Expose HTTP on port 80
  local: true

binary_sensor:
  # Push button configuration on GPIO10 (physical button you might have)
  - platform: gpio
    pin:
      number: 10
      mode: INPUT_PULLUP
      inverted: true
    name: "Push Button"
    on_press:
      - script.execute: relay_timer_script

  # this will be the GPIO used as Push button from a Receiver (remotes should be contacting that device)
  - platform: gpio
    pin:
      number: 21
      mode: INPUT_PULLUP
      inverted: true
    name: "External Trigger"
    on_press:
      - logger.log: "External trigger button was pressed!"
      - script.execute: relay_timer_script

button:
  # Virtual Push Button to show on this device Web Interface.
  - platform: template
    name: Virtual Push Button
    id: pushbutton
    on_press:
      - script.execute: relay_timer_script


output:
  # Relay configuration on GPIO20 (relay connected to the doors)
  - platform: gpio
    pin:
      number: 20
      inverted: true
    id: relay_switch

# Number variable for relay duration (default 7 seconds)
number:
  - platform: template
    name: "Relay Duration"
    id: relay_duration
    unit_of_measurement: "s"
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 7
    mode: slider
    set_action:
      - logger.log:
          format: "Relay duration set to %.1f seconds"
          args: [ "x" ]

# Script to activate relay for the duration
script:
  - id: relay_timer_script
    then:
      - output.turn_on: relay_switch
      - delay: !lambda 'return (int(id(relay_duration).state * 1000));' # Convert seconds to milliseconds
      - output.turn_off: relay_switch

# Status LED (optional)
#status_led:
#  pin:
#    number: GPIO2
#    inverted: true

# Internal temperature sensor
sensor:
  - platform: internal_temperature
    name: "DoorESP32 Internal Temperature"
